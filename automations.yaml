- id: '1786482786614'
  alias: '@Let''s encrypt certificate check.'
  description: Home Assistant certificate will expire in 3 weeks
  triggers:
  - at: 03:00:00
    trigger: time
  conditions:
  - condition: template
    value_template: '{{ (states(''sensor.homeassistant_theoltmanfamily_net_cert_expiry'')
      | as_datetime - timedelta(days=21)) < now() }}'
  actions:
  - data:
      title: Let's Encrypt
      message: The Certificate will expire in 3 weeks, trying to renew, please verify
    action: notify.jims_phone
  - data:
      addon: core_letsencrypt
    action: hassio.addon_start
  - delay:
      hours: 0
      minutes: 5
      seconds: 0
      milliseconds: 0
  - action: homeassistant.restart
    metadata: {}
    data: {}
  mode: single
