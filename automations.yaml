- id: '1742003157745'
  alias: FamilyRoom_Plex_Charlie_Lights
  description: ''
  triggers:
  - trigger: state
    entity_id:
    - media_player.plex_plex_for_android_tv_shield_android_tv
    attribute: username
    to: Charlie Oltman
    for:
      hours: 0
      minutes: 0
      seconds: 5
  - trigger: state
    entity_id:
    - media_player.plex_plex_for_android_tv_shield_android_tv
    from: idle
    to: playing
    for:
      hours: 0
      minutes: 0
      seconds: 5
    id: Idle_Playing
  - trigger: state
    entity_id:
    - media_player.plex_plex_for_android_tv_shield_android_tv
    from: playing
    to: idle
    for:
      hours: 0
      minutes: 0
      seconds: 5
    id: Playing_Idle
  conditions:
  - condition: sun
    before: sunrise
    before_offset: +00:30:00
    after: sunset
    after_offset: -00:15:00
  actions:
  - choose:
    - conditions:
      - condition: trigger
        id:
        - Idle_Playing
      sequence:
      - action: scene.create
        metadata: {}
        data:
          scene_id: tv_show_light_state
          snapshot_entities:
          - light.family_room_lamp
      - action: light.turn_on
        metadata: {}
        data:
          transition: 2
          brightness_pct: 15
        target:
          device_id: e11f1a7da1121850539308bb7128593d
    - conditions:
      - condition: trigger
        id:
        - Playing_Idle
      sequence:
      - action: scene.turn_on
        metadata: {}
        data:
          transition: 3
        target:
          entity_id: scene.tv_show_light_state
  mode: single
- id: '1742003858893'
