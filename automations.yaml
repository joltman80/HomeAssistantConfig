        id:
        - Playing_Paused
      sequence:
      - action: light.turn_on
        metadata: {}
        data:
          transition: 3
          brightness_pct: 25
        target:
          device_id: e11f1a7da1121850539308bb7128593d
          entity_id: light.kitchen_main_lights
    - conditions:
      - condition: trigger
        id:
        - Paused_Playing
      sequence:
      - action: light.turn_off
        metadata: {}
